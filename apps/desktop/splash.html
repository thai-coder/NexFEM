<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexFEM</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; cursor: default; user-select: none; -webkit-user-select: none; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        background: linear-gradient(150deg, #2f7fe8 0%, #1a56c4 45%, #12409a 100%);
        color: #fff; font-family: "Segoe UI Variable", "Segoe UI", "DejaVu Sans", Arial, sans-serif;
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
      .logo { margin-bottom: 6px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35)); }
      h1 { margin: 0; font-size: 44px; font-weight: 700; letter-spacing: 0.5px; }
      .tag { font-size: 16px; opacity: 0.92; }
      .ver { margin-top: 10px; font-size: 13px; opacity: 0.8; }
      .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255, 255, 255, 0.2); overflow: hidden; }
      .bar::after {
        content: ""; position: absolute; top: 0; bottom: 0; width: 38%; background: #ffd400; border-radius: 2px;
        animation: slide 1.3s ease-in-out infinite;
      }
      .foot { position: absolute; left: 16px; bottom: 14px; font-size: 11px; opacity: 0.7; }
      @keyframes slide { 0% { left: -40%; } 100% { left: 102%; } }
    </style>
  </head>
  <body>
    <div class="logo"><svg width="112" height="112" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7fe8"/>
      <stop offset="1" stop-color="#1747a6"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#g)"/>
  <!-- khung kết cấu cách điệu thành chữ N -->
  <path d="M300 760V264l424 496V264" fill="none" stroke="#fff" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M232 760h560" stroke="#ffd400" stroke-width="40" stroke-linecap="round"/>
</svg></div>
    <h1>NexFEM</h1>
    <div class="tag">Structural Analysis Application</div>
    <div class="ver">Version %APP_VERSION%</div>
    <div class="foot">© lkat.vn</div>
    <div class="bar"></div>
  </body>
</html>
