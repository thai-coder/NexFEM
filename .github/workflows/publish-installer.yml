name: Publish installer

# Đưa bộ cài đã build ở một lần chạy CI lên nhánh `installer` (cắt phần < 100 MB) và một bản Release.
# Đổi SOURCE_RUN_ID rồi đẩy file này lên để phát hành lại.
on:
  push:
    paths: [".github/workflows/publish-installer.yml"]
  workflow_dispatch:

env:
  SOURCE_RUN_ID: "42345459872"
  TAG: "v0.1.0-alpha.3"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          pattern: nexfem-windows-*
          merge-multiple: true
          path: dl

      - name: Nhánh installer (cắt phần 95 MB)
        run: |
          set -euo pipefail
          exe=$(find "$PWD/dl" -name '*-setup.exe' | head -1)
          msi=$(find "$PWD/dl" -name '*.msi' | head -1)
          echo "EXE=$exe" >> "$GITHUB_ENV"
          echo "MSI=$msi" >> "$GITHUB_ENV"
          ls -la "$exe" "$msi"
          mkdir out && cd out
          name=$(basename "$exe")
          split -b 95m -d -a 2 "$exe" "$name.part"
          sum=$(sha256sum "$exe" | cut -d' ' -f1)
          printf '@echo off\r\ncd /d "%%~dp0"\r\ncopy /b "%s.part*" "%s" >nul\r\necho Da ghep: %s\r\ncertutil -hashfile "%s" SHA256\r\necho SHA256 dung phai la: %s\r\npause\r\n' "$name" "$name" "$name" "$name" "$sum" > GHEP-BO-CAI.bat
          cat > README.md <<MD
          # Bộ cài NexFEM (bản thử)

          Nguồn: CI run ${SOURCE_RUN_ID}, commit ${GITHUB_SHA}.

          Cách nhanh nhất: tải nguyên file ở trang Releases, tag **${TAG}**.

          Hoặc từ nhánh này:
          1. Tải nhánh dạng ZIP (Code → Download ZIP) rồi giải nén.
          2. Chạy \`GHEP-BO-CAI.bat\` để ghép các file \`.part\` thành \`${name}\`.
          3. Chạy \`${name}\` bằng quyền quản trị (cài cho mọi tài khoản trên máy).

          SHA256: \`${sum}\`

          Windows sẽ cảnh báo SmartScreen vì bộ cài chưa có chữ ký số: More info → Run anyway.
          MD
          sed -i 's/^          //' README.md
          git init -q -b installer
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "NexFEM installer from CI run ${SOURCE_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" installer
          ls -la

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" -R "${{ github.repository }}" -y --cleanup-tag || true
          gh release create "$TAG" "$EXE" "$MSI" -R "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "NexFEM $TAG (bản thử)" \
            --notes "Bộ cài thử nghiệm Giai đoạn 3. Chạy file -setup.exe hoặc .msi bằng quyền quản trị. Chưa có chữ ký số: SmartScreen → More info → Run anyway."
