name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript · test · e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test scripts/validation/compare-csi.test.mjs
      - run: pnpm build
      - run: pnpm --filter @nexfem/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: tests/e2e/test-results
          retention-days: 7

  rust:
    name: Rust · fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Thư viện WebKitGTK cho Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      # tauri::generate_context! cần thư mục frontend tồn tại lúc biên dịch.
      - run: mkdir -p apps/desktop/dist
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Bộ cài Windows (.msi, .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # Mỗi lần đẩy code là một phiên bản: 0.<MINOR từ file VERSION>.<số lần chạy CI>.
      - name: Đặt số phiên bản
        run: node scripts/set-version.mjs --build ${{ github.run_number }}
      - run: pnpm tauri build
      - name: Kiểm tra bộ cài MSI (cài cho toàn máy, chạy bằng 2 tài khoản, gỡ cài)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1).FullName
          ./scripts/ci/test-windows-install.ps1 -Kind msi -Installer $msi -ExpectedVersion $env:NEXFEM_VERSION
      - name: Kiểm tra bộ cài NSIS (.exe)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          ./scripts/ci/test-windows-install.ps1 -Kind nsis -Installer $exe -ExpectedVersion $env:NEXFEM_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: nexfem-windows-${{ github.sha }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          retention-days: 14

  # Mỗi lần CI trên nhánh phát triển đạt: đưa bộ cài lên nhánh `installer` (cắt phần < 100 MB)
  # và tạo một bản phát hành mới `v<phiên bản>` (đánh dấu "latest") để tải về chạy thử.
  publish:
    name: Phát hành bộ cài thử
    needs: [web, rust, windows]
    # Nhánh phát triển: phát hành chính thức khi push. Nhánh khác: chỉ khi chạy tay (Actions ▸ CI ▸ Run workflow),
    # tạo bản phát hành thử (pre-release) `test-<tên nhánh>` để tải về cài thử, không đụng nhánh `installer`.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/claude/etab-sap2000-connection-vts58p') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nexfem-windows-*
          merge-multiple: true
          path: dl

      - name: Chuẩn bị bản thử (nhánh khác nhánh phát triển)
        if: github.ref != 'refs/heads/claude/etab-sap2000-connection-vts58p'
        run: |
          set -euo pipefail
          exe=$(find "$PWD/dl" -name '*-setup.exe' | head -1)
          msi=$(find "$PWD/dl" -name '*.msi' | head -1)
          VERSION=$(basename "$exe" | sed -E 's/^NexFEM_([0-9]+\.[0-9]+\.[0-9]+)_.*/\1/')
          case "$VERSION" in *[!0-9.]*|"") echo "Không đọc được phiên bản từ $exe"; exit 1;; esac
          # Tên nhánh -> tên tag an toàn: chỉ chữ, số, gạch ngang.
          SLUG=$(printf '%s' "${GITHUB_REF_NAME}" | sed -E 's#^claude/##; s#[^A-Za-z0-9]+#-#g; s#^-+|-+$##g')
          echo "EXE=$exe" >> "$GITHUB_ENV"
          echo "MSI=$msi" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=test-$SLUG" >> "$GITHUB_ENV"
          echo "PRERELEASE=1" >> "$GITHUB_ENV"
          ls -la "$exe" "$msi"

      - name: Nhánh installer (cắt phần 95 MB)
        if: github.ref == 'refs/heads/claude/etab-sap2000-connection-vts58p'
        run: |
          set -euo pipefail
          exe=$(find "$PWD/dl" -name '*-setup.exe' | head -1)
          msi=$(find "$PWD/dl" -name '*.msi' | head -1)
          # Phiên bản lấy từ tên file: NexFEM_<phiên bản>_x64-setup.exe
          VERSION=$(basename "$exe" | sed -E 's/^NexFEM_([0-9]+\.[0-9]+\.[0-9]+)_.*/\1/')
          case "$VERSION" in *[!0-9.]*|"") echo "Không đọc được phiên bản từ $exe"; exit 1;; esac
          TAG="v$VERSION"
          echo "EXE=$exe" >> "$GITHUB_ENV"
          echo "MSI=$msi" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          ls -la "$exe" "$msi"
          mkdir out && cd out
          name=$(basename "$exe")
          split -b 95m -d -a 2 "$exe" "$name.part"
          sum=$(sha256sum "$exe" | cut -d' ' -f1)
          printf '@echo off\r\ncd /d "%%~dp0"\r\ncopy /b "%s.part*" "%s" >nul\r\necho Da ghep: %s\r\ncertutil -hashfile "%s" SHA256\r\necho SHA256 dung phai la: %s\r\npause\r\n' "$name" "$name" "$name" "$name" "$sum" > GHEP-BO-CAI.bat
          cat > README.md <<MD
          # Bộ cài NexFEM ${VERSION} (bản thử)

          Nhà phát hành: lkat.vn. Nguồn: CI run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}.

          Cách nhanh nhất: tải nguyên file ở trang Releases, tag **${TAG}**.

          Hoặc từ nhánh này:
          1. Tải nhánh dạng ZIP (Code → Download ZIP) rồi giải nén.
          2. Chạy \`GHEP-BO-CAI.bat\` để ghép các file \`.part\` thành \`${name}\`.
          3. Chạy \`${name}\` bằng quyền quản trị (cài cho mọi tài khoản trên máy).

          SHA256: \`${sum}\`

          Windows sẽ cảnh báo SmartScreen vì bộ cài chưa có chữ ký số: More info → Run anyway.
          MD
          sed -i 's/^          //' README.md
          git init -q -b installer
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "NexFEM ${VERSION} installer (CI run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" installer
          ls -la

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bản phát hành cố định "latest-build" của các lần trước được thay bằng bản có số phiên bản.
          [ "${PRERELEASE:-}" = "1" ] || gh release delete latest-build -R "${{ github.repository }}" -y --cleanup-tag || true
          # Chạy lại cùng một lần CI thì thay bản cũ cùng phiên bản.
          gh release delete "$TAG" -R "${{ github.repository }}" -y --cleanup-tag || true
          if [ "${PRERELEASE:-}" = "1" ]; then
            # Bản thử của nhánh ${GITHUB_REF_NAME}: pre-release, không phải "latest", thay bản thử cũ cùng nhánh.
            gh release create "$TAG" "$EXE" "$MSI" -R "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
              --title "NexFEM $VERSION (bản thử: ${GITHUB_REF_NAME})" \
              --notes "Bản thử của nhánh ${GITHUB_REF_NAME}, NexFEM $VERSION (nhà phát hành: lkat.vn). CI run ${{ github.run_id }}, commit ${{ github.sha }}. Chưa qua review. Chạy file -setup.exe hoặc .msi bằng quyền quản trị. Chưa có chữ ký số: SmartScreen → More info → Run anyway."
          else
            gh release create "$TAG" "$EXE" "$MSI" -R "${{ github.repository }}" --target "${{ github.sha }}" --latest \
              --title "NexFEM $VERSION" \
              --notes "NexFEM $VERSION (nhà phát hành: lkat.vn). Bản build tự động từ CI run ${{ github.run_id }}, commit ${{ github.sha }}. Chạy file -setup.exe hoặc .msi bằng quyền quản trị. Chưa có chữ ký số: SmartScreen → More info → Run anyway."
          fi
