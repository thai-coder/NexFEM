name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript · test · e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @nexfem/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: tests/e2e/test-results
          retention-days: 7

  rust:
    name: Rust · fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Thư viện WebKitGTK cho Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      # tauri::generate_context! cần thư mục frontend tồn tại lúc biên dịch.
      - run: mkdir -p apps/desktop/dist
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Bộ cài Windows (.msi, .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Kiểm tra bộ cài MSI (cài cho toàn máy, chạy bằng 2 tài khoản, gỡ cài)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1).FullName
          ./scripts/ci/test-windows-install.ps1 -Kind msi -Installer $msi
      - name: Kiểm tra bộ cài NSIS (.exe)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          ./scripts/ci/test-windows-install.ps1 -Kind nsis -Installer $exe
      - uses: actions/upload-artifact@v4
        with:
          name: nexfem-windows-${{ github.sha }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          retention-days: 14

  # Mỗi lần CI trên nhánh phát triển đạt: đưa bộ cài lên nhánh `installer` (cắt phần < 100 MB)
  # và bản pre-release `latest-build` để tải về chạy thử.
  publish:
    name: Phát hành bộ cài thử
    needs: [web, rust, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/etab-sap2000-connection-vts58p'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: latest-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nexfem-windows-*
          merge-multiple: true
          path: dl

      - name: Nhánh installer (cắt phần 95 MB)
        run: |
          set -euo pipefail
          exe=$(find "$PWD/dl" -name '*-setup.exe' | head -1)
          msi=$(find "$PWD/dl" -name '*.msi' | head -1)
          echo "EXE=$exe" >> "$GITHUB_ENV"
          echo "MSI=$msi" >> "$GITHUB_ENV"
          ls -la "$exe" "$msi"
          mkdir out && cd out
          name=$(basename "$exe")
          split -b 95m -d -a 2 "$exe" "$name.part"
          sum=$(sha256sum "$exe" | cut -d' ' -f1)
          printf '@echo off\r\ncd /d "%%~dp0"\r\ncopy /b "%s.part*" "%s" >nul\r\necho Da ghep: %s\r\ncertutil -hashfile "%s" SHA256\r\necho SHA256 dung phai la: %s\r\npause\r\n' "$name" "$name" "$name" "$name" "$sum" > GHEP-BO-CAI.bat
          cat > README.md <<MD
          # Bộ cài NexFEM (bản thử)

          Nguồn: CI run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}.

          Cách nhanh nhất: tải nguyên file ở trang Releases, tag **${TAG}**.

          Hoặc từ nhánh này:
          1. Tải nhánh dạng ZIP (Code → Download ZIP) rồi giải nén.
          2. Chạy \`GHEP-BO-CAI.bat\` để ghép các file \`.part\` thành \`${name}\`.
          3. Chạy \`${name}\` bằng quyền quản trị (cài cho mọi tài khoản trên máy).

          SHA256: \`${sum}\`

          Windows sẽ cảnh báo SmartScreen vì bộ cài chưa có chữ ký số: More info → Run anyway.
          MD
          sed -i 's/^          //' README.md
          git init -q -b installer
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "NexFEM installer from CI run ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" installer
          ls -la

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" -R "${{ github.repository }}" -y --cleanup-tag || true
          gh release create "$TAG" "$EXE" "$MSI" -R "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "NexFEM — bản build mới nhất (bản thử)" \
            --notes "Bản build tự động từ CI run ${{ github.run_id }}, commit ${{ github.sha }}. Chạy file -setup.exe hoặc .msi bằng quyền quản trị. Chưa có chữ ký số: SmartScreen → More info → Run anyway."
